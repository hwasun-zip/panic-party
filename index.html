// - A안: 우선순위 없음 (위험 예고가 축제 연출과 같은 색, 동료 이펙트가 맨 위, 내 캐릭터 표시 없음)

//     ① 위험 공격은 항상 빨간색 + 굵은 테두리 + 아이콘  ② 연출 이펙트에는 빨간색을 쓰지 않음  ③ 위험 예고는 이펙트보다 위에 그림

// - 모든 그래픽은 도형으로 직접 그린 오리지널입니다.
// =====================================================================

// ---------- 기록 ----------
const LOG = {
  init() {
    const p = new URLSearchParams(location.search);
    this.debug = p.get('debug') === '1';
    this.player = this.store('pp_player') || this.store('pp_player', Math.random().toString(36).slice(2, 10));
    let order = p.get('order');
    if (order !== 'AB' && order !== 'BA') order = Math.random() < 0.5 ? 'AB' : 'BA';
    this.order = order;
    this.session = Math.random().toString(36).slice(2, 10);
    this.rounds = [];
    this.send('pp_session_start', { order });
  },
  store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return v; },
  send(event, data = {}) {
    const rec = { time: new Date().toISOString(), player: this.player, session: this.session, group: this.order,
      version: CFG.version, debug: this.debug ? 1 : 0, event, pattern_hits: data };
    if (this.debug) console.log('[PP]', rec);
    if (!CFG.endpoint) return;
    try { fetch(CFG.endpoint, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(rec) }).catch(() => {}); } catch (e) {}
  },
};

  const z = ZONES[zi]; let seed = 11 + zi * 7;

  return z.patterns.map((type, i) => ({ t: z.pStart + i * z.pGap + rnd() * 0.3, type, off: Math.round(rnd() * 120 - 60), r: rnd() }));

// ---------- 효과음 (파일 없이 Web Audio로 생성) ----------
const SFX = {
  ctx: null,
  init() { try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  tone(freq, dur, type = 'square', vol = 0.06, slide = 0) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
  },
  hit(n = 1) { this.tone(320 + n * 90, 0.07, 'square', 0.05, -120); },
  big() { this.tone(180, 0.18, 'sawtooth', 0.07, -100); this.tone(520, 0.1, 'square', 0.04); },
  hurt() { this.tone(140, 0.25, 'sawtooth', 0.08, -80); },
  kill() { [660, 880, 1100].forEach((f, i) => setTimeout(() => this.tone(f, 0.08, 'triangle', 0.05), i * 50)); },
  clear() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.14, 'triangle', 0.07), i * 90)); },
  fail() { [392, 330, 262].forEach((f, i) => setTimeout(() => this.tone(f, 0.16, 'triangle', 0.06), i * 110)); },
  ok() { this.tone(880, 0.08, 'triangle', 0.06); setTimeout(() => this.tone(1320, 0.1, 'triangle', 0.06), 70); },
  jump() { this.tone(300, 0.08, 'triangle', 0.03, 200); },
  dash() { this.tone(500, 0.08, 'sawtooth', 0.025, -300); },
};

// ---------- 공통: 주인공 조작 (튜토리얼과 본 게임에서 같이 사용) ----------
class Hero {
  constructor(scene, x, depth) {
    this.s = scene; this.sp = scene.add.image(x, CFG.GROUND - 35, 'me').setScale(1.2).setDepth(depth);
    this.vy = 0; this.onGround = true; this.face = 1;
    this.invuln = 0; this.dashT = 0; this.dashCd = 0; this.atkCd = 0; this.combo = 0; this.comboT = 0; this.spinCd = 0;
    this.keys = scene.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,X,Z,C,V');
    this.events = { moved: 0, jumps: 0, dashes: 0, attacks: 0, combo3: 0, spins: 0 };
  }
  get x() { return this.sp.x; } get y() { return this.sp.y; }
  update(dt, minX, maxX, onAttack, onSpin) {
    const k = this.keys, sp = this.sp;
    this.dashCd -= dt; this.atkCd -= dt; this.invuln -= dt; this.comboT -= dt; this.spinCd -= dt;
    const x0 = sp.x;
    if (this.dashT > 0) { this.dashT -= dt; sp.x += this.face * 640 * dt; }
    else {
      let mv = 0; if (k.LEFT.isDown) mv -= 1; if (k.RIGHT.isDown) mv += 1;
      if (mv) this.face = mv;
      sp.x += mv * 280 * dt;
      if ((Phaser.Input.Keyboard.JustDown(k.UP) || Phaser.Input.Keyboard.JustDown(k.SPACE)) && this.onGround) { this.vy = -580; this.onGround = false; this.events.jumps++; SFX.jump(); }
      if (Phaser.Input.Keyboard.JustDown(k.X) && this.dashCd <= 0) { this.dashT = 0.22; this.dashCd = 0.8; this.events.dashes++; SFX.dash(); this.afterimage(); }
      if (Phaser.Input.Keyboard.JustDown(k.Z) && this.atkCd <= 0) this.attack(onAttack);
      if (Phaser.Input.Keyboard.JustDown(k.C) && this.spinCd <= 0) this.spin(onSpin);
    }
    this.vy += 1500 * dt; sp.y += this.vy * dt;
    if (sp.y >= CFG.GROUND - 35) { sp.y = CFG.GROUND - 35; this.vy = 0; this.onGround = true; }
    sp.x = Phaser.Math.Clamp(sp.x, minX, maxX);
    this.events.moved += Math.abs(sp.x - x0);
    sp.flipX = this.face < 0;
    sp.setAlpha(this.invuln > 0 ? (Math.floor(this.s.time.now / 50) % 2 ? 0.35 : 1) : 1);
  }
  afterimage() {
    for (let i = 0; i < 3; i++) this.s.time.delayedCall(i * 50, () => {
      const g = this.s.add.image(this.sp.x, this.sp.y, 'me').setScale(1.2).setAlpha(0.4).setTint(0xb9b2ff).setDepth(this.sp.depth - 1); g.flipX = this.sp.flipX;
      this.s.tweens.add({ targets: g, alpha: 0, duration: 220, onComplete: () => g.destroy() });
    });
  }
  attack(cb) {
    this.atkCd = 0.18; this.events.attacks++;
    this.combo = this.comboT > 0 ? (this.combo % 3) + 1 : 1; this.comboT = 0.5;
    if (this.combo === 3) this.events.combo3++;
    const dmg = [0, 30, 36, 60][this.combo];
    const sl = this.s.add.image(this.sp.x + this.face * 30, this.sp.y - 4, 'slash').setTint(this.combo === 3 ? 0xffc94a : 0xffffff).setScale(this.combo === 3 ? 1.7 : 1.25).setDepth(this.sp.depth + 1);
    sl.flipX = this.face < 0; sl.angle = this.combo === 2 ? -30 : 0;
    this.s.tweens.add({ targets: sl, alpha: 0, x: sl.x + this.face * 22, duration: 170, onComplete: () => sl.destroy() });
    this.s.tweens.add({ targets: this.sp, scaleX: 1.32, scaleY: 1.1, duration: 60, yoyo: true });
    if (this.combo === 3) this.sp.x += this.face * 24;
    if (cb) cb(dmg, this.combo, this.face);
  }
  spin(cb) {
    this.spinCd = 5; this.events.spins++; SFX.big();
    const ring = this.s.add.circle(this.sp.x, this.sp.y, 20, 0xffc94a, 0.25).setStrokeStyle(6, 0xffc94a, 1).setDepth(this.sp.depth + 1);
    this.s.tweens.add({ targets: ring, radius: 170, alpha: 0, duration: 380, onComplete: () => ring.destroy() });
    this.s.tweens.add({ targets: this.sp, angle: 360 * this.face, duration: 380, onComplete: () => this.sp.setAngle(0) });
    if (cb) cb();
  }
}

// ---------- 공통: 맞았을 때 반응 (불꽃, 숫자, 경직) ----------
function hitBurst(scene, x, y, amount, big, depth) {
  for (let i = 0; i < (big ? 10 : 6); i++) {
    const d = scene.add.image(x, y, 'spark').setTint(big ? 0xffc94a : 0xffffff).setDepth(depth).setScale(big ? 1.3 : 1);
    const ang = Math.random() * Math.PI * 2, r = 30 + Math.random() * (big ? 60 : 35);
    scene.tweens.add({ targets: d, x: x + Math.cos(ang) * r, y: y + Math.sin(ang) * r, angle: 180, alpha: 0, scale: 0.2, duration: 260, onComplete: () => d.destroy() });
  }
  const t = scene.add.text(x + Phaser.Math.Between(-16, 16), y - 20, String(amount), { fontFamily: FONT, fontSize: big ? 30 : 22, fontStyle: 'bold', color: big ? '#ffc94a' : '#ffffff', stroke: '#2a2350', strokeThickness: 5 }).setOrigin(0.5).setDepth(depth + 1);
  scene.tweens.add({ targets: t, y: t.y - 50, scale: { from: 1.4, to: 1 }, alpha: { from: 1, to: 0 }, duration: 650, onComplete: () => t.destroy() });
}

// ---------- 공통: 키캡 그리기 ----------
function keycap(scene, x, y, label, w = 44) {
  const c = scene.add.container(x, y);
  const g = scene.add.graphics();
  g.fillStyle(0x1d1830, 0.35); g.fillRoundedRect(-w / 2, -18, w, 40, 8);
  g.fillStyle(0xffffff, 1); g.fillRoundedRect(-w / 2, -22, w, 38, 8);
  g.lineStyle(2, 0xd9cff7, 1); g.strokeRoundedRect(-w / 2, -22, w, 38, 8);
  c.add(g); c.add(scene.add.text(0, -3, label, { fontFamily: FONT, fontSize: 16, fontStyle: 'bold', color: '#2a2350' }).setOrigin(0.5));
  return c;
}

    this.card = this.add.container(W / 2, 92).setDepth(100);

    this.stepTitle = this.add.text(0, -26, '', { fontFamily: FONT, fontSize: 22, fontStyle: 'bold', color: '#2a2350', align: 'center' }).setOrigin(0.5);
    this.stepSub = this.add.text(0, 6, '', { fontFamily: FONT, fontSize: 15, color: '#5b5480', align: 'center' }).setOrigin(0.5);
    this.keyRow = this.add.container(0, 38);
    this.card.add([this.stepNo, this.stepTitle, this.stepSub, this.keyRow]);
    this.dots = [];
    this.add.text(W - 14, H - 12, 'Esc 건너뛰기', { fontFamily: FONT, fontSize: 12, color: '#8a7fc0' }).setOrigin(1, 1);

      { title: '이 캐릭터가 바로 나예요!', sub: '금색 가면과 흰 연미복을 기억해 두세요. 혼잡한 파티에서 나를 찾아야 해요.', keys: [['Enter', 70]], check: () => this.enter },
      { title: '좌우로 움직여 보세요', sub: '', keys: [['←'], ['→']], check: () => this.hero.events.moved > 300 },
      { title: '점프 2번', sub: '바닥을 쓸고 오는 공격은 점프로 피해요.', keys: [['↑'], ['Space', 80]], check: () => this.hero.events.jumps >= 2 },
      { title: '대시 2번', sub: '대시하는 순간에는 잠깐 무적이에요.', keys: [['X']], check: () => this.hero.events.dashes >= 2 },
      { title: '허수아비에게 3연속 베기', sub: 'Z를 빠르게 3번 누르면 마지막 일격이 강해져요.', keys: [['Z'], ['Z'], ['Z']], check: () => this.combo3Hit },
      { title: '회전 베기', sub: '주변을 크게 베는 필살기. 5초마다 쓸 수 있어요.', keys: [['C']], check: () => this.spinHit },
      { title: '바닥 표시를 피해 보세요 (3번)', sub: '공격 전에는 표시가 나타나요. 맞으면 체력이 줄어요.', keys: [['←'], ['→'], ['X']], check: () => this.dodged >= 3 },
      { title: '준비 완료!', sub: '노란 육각형 방패는 기사가 준 보호막이에요. 공격을 1번 막아 줘요.', keys: [['Enter', 70]], check: () => this.enter },
    ];
    this.steps.forEach((_, i) => { const d = this.add.circle(W / 2 - (this.steps.length - 1) * 9 + i * 18, 176, 5, 0xd9cff7).setDepth(100); this.dots.push(d); });
    this.input.keyboard.on('keydown-ENTER', () => { this.enter = true; });
    this.dodged = 0; this.tele = null; this.idx = -1; this.wait = 0;
    this.next();
  }
  next() {
    this.idx++;
    if (this.idx >= this.steps.length) return this.finish();
    this.enter = false;
    const st = this.steps[this.idx];
    this.stepNo.setText(`STEP ${this.idx + 1} / ${this.steps.length}`);
    this.stepTitle.setText(st.title); this.stepSub.setText(st.sub);
    this.keyRow.removeAll(true);
    let x = -((st.keys.length - 1) * 60) / 2;
    st.keys.forEach(([k, w]) => { this.keyRow.add(keycap(this, x, 0, k, w || 44)); x += 60; });
    this.dots.forEach((d, i) => d.setFillStyle(i < this.idx ? 0x8f86ff : i === this.idx ? 0xffc94a : 0xd9cff7));
    this.card.setScale(0.9); this.tweens.add({ targets: this.card, scale: 1, duration: 200, ease: 'Back.out' });
    if (this.idx === 0) this.spotlight(true);
    if (this.idx === 1) this.spotlight(false);
  }
  spotlight(on) {
    if (on) {
      this.dim = this.add.rectangle(CFG.W / 2, CFG.H / 2, CFG.W, CFG.H, 0x1d1830, 0.45).setDepth(25);
      this.ring = this.add.circle(this.hero.x, this.hero.y, 50, 0xffffff, 0).setStrokeStyle(4, 0xffc94a).setDepth(31);
      this.tweens.add({ targets: this.ring, scale: 1.2, duration: 500, yoyo: true, repeat: -1 });
      this.meTag = this.add.text(this.hero.x, this.hero.y - 80, '나', { fontFamily: FONT, fontSize: 18, fontStyle: 'bold', color: '#ffffff', backgroundColor: '#e0a21c', padding: { x: 10, y: 4 } }).setOrigin(0.5).setDepth(31);
    } else { [this.dim, this.ring, this.meTag].forEach(o => o && o.destroy()); }
  }
  done() {
    SFX.ok(); this.wait = 0.9;
    const ok = this.add.text(CFG.W / 2, 250, '좋아요! ✔', { fontFamily: FONT, fontSize: 30, fontStyle: 'bold', color: '#1fa36b', stroke: '#ffffff', strokeThickness: 6 }).setOrigin(0.5).setDepth(101);
    this.tweens.add({ targets: ok, y: 220, alpha: 0, duration: 900, onComplete: () => ok.destroy() });
  }
  update(time, ms) {
    const dt = Math.min(ms / 1000, 0.05);
    if (this.idx < 0 || this.left) return;
    const st = this.steps[this.idx];
    const canMove = this.idx > 0 && this.idx < this.steps.length - 1;
    if (canMove) this.hero.update(dt, 30, CFG.W - 30,
      (dmg, combo, face) => { const dx = (this.dummy.x - this.hero.x) * face; if (dx > -30 && dx < 120) { this.hitDummy(dmg, combo === 3); if (combo === 3 && this.idx === 4) this.combo3Hit = true; } },
      () => { if (Math.abs(this.dummy.x - this.hero.x) < 200) { this.hitDummy(120, true); if (this.idx === 5) this.spinHit = true; } });
    if (this.dummyFlash > 0) { this.dummyFlash -= dt; if (this.dummyFlash <= 0) this.dummy.clearTint(); }
    if (this.idx === 6) this.dodgeStep(dt);
    if (this.wait > 0) { this.wait -= dt; if (this.wait <= 0) this.next(); return; }
    if (st.check()) this.done();
  }
  hitDummy(dmg, big) {
    big ? SFX.big() : SFX.hit(); this.dummy.setTint(0xffffff); this.dummyFlash = 0.08;
    this.tweens.add({ targets: this.dummy, angle: { from: big ? 14 : 7, to: 0 }, duration: 260, ease: 'Back.out' });
    hitBurst(this, this.dummy.x, this.dummy.y - 20, dmg, big, 60);
    if (big) this.cameras.main.shake(90, 0.004);
  }
  dodgeStep(dt) {
    if (this.wait > 0) return;
    if (!this.tele) {
      const x = this.hero.x;
      this.tele = { x, t: 1.2, g: this.add.ellipse(x, CFG.GROUND, 180, 34, 0xffffff, 0.3).setStrokeStyle(3, 0x8a7fc0, 1).setDepth(15) };
      this.tweens.add({ targets: this.tele.g, alpha: { from: 0.4, to: 1 }, duration: 200, yoyo: true, repeat: -1 });
      return;
    }
    this.tele.t -= dt;
    if (this.tele.t <= 0) {
      const hit = Math.abs(this.hero.x - this.tele.x) < 90 && this.hero.dashT <= 0;
      const jet = this.add.rectangle(this.tele.x, CFG.GROUND, 130, 10, 0x9fd3ff, 0.9).setOrigin(0.5, 1).setDepth(16);
      this.tweens.add({ targets: jet, height: 240, alpha: 0, duration: 380, onComplete: () => jet.destroy() });
      this.tweens.killTweensOf(this.tele.g); this.tele.g.destroy(); this.tele = null;
      if (hit) { this.hp = Math.max(20, this.hp - 20); this.hpUI.set(this.hp); SFX.hurt(); this.cameras.main.flash(120, 255, 80, 100); this.hero.invuln = 0.6; }
      else { this.dodged++; SFX.ok(); this.stepTitle.setText(`바닥 표시를 피해 보세요 (${this.dodged}/3)`); }
    }
  }
  finish() { this.left = true; this.scene.start('Round', { index: 0 }); }
}

  // ---------- 맵: 정원 테라스(0~1400) → 무도회장(1400~2700) → 무대(2700~) ----------
  drawWorld() {
    const { H, GROUND, WORLD } = CFG;
    const bg = this.add.graphics().setDepth(this.D.bg);
    // 구역 1: 정원 테라스 (0~1000) 노을 하늘
    bg.fillGradientStyle(0xffd9c2, 0xffd9c2, 0xd8c8ff, 0xd8c8ff, 1); bg.fillRect(0, 0, 1400, GROUND);
    bg.fillStyle(0xffffff, 0.6); [120, 420, 760, 1100].forEach(x => { bg.fillCircle(x, 110, 26); bg.fillCircle(x + 30, 100, 32); bg.fillCircle(x + 64, 112, 24); });
    bg.fillStyle(0x9ad1b0, 1); for (let x = 0; x < 1400; x += 90) bg.fillCircle(x + 40, GROUND - 20, 46);     // 정원 수풀
    bg.fillStyle(0xfff1c2, 1); for (let x = 30; x < 1400; x += 140) { bg.fillRect(x, GROUND - 150, 6, 130); bg.fillCircle(x + 3, GROUND - 156, 10); }  // 가로등
    // 구역 2: 무도회장 (1000~2100) 파스텔 홀
    bg.fillGradientStyle(0xbfe3ff, 0xbfe3ff, 0xe6d9ff, 0xe6d9ff, 1); bg.fillRect(1400, 0, 1300, GROUND);
    bg.fillStyle(0xffffff, 0.4); for (let x = 1460; x < 2700; x += 260) bg.fillRoundedRect(x, 70, 120, 200, { tl: 60, tr: 60, bl: 4, br: 4 });
    for (let x = 1500; x < 2700; x += 300) {                                   // 샹들리에
      bg.lineStyle(2, 0xe8b84a, 1); bg.lineBetween(x, 0, x, 40);
      bg.fillStyle(0xe8b84a, 1); bg.fillEllipse(x, 48, 70, 14);
      bg.fillStyle(0xfff6d8, 1); for (let k = -2; k <= 2; k++) bg.fillCircle(x + k * 14, 58, 4);
    }
    // 구역 3: 무대 (2100~3000) 보라 커튼과 조명
    bg.fillStyle(0x3b2f7a, 1); bg.fillRect(2700, 0, WORLD - 2700, GROUND);
    for (let x = 2700; x < WORLD; x += 40) { bg.fillStyle(x % 80 ? 0x7d6bd6 : 0x6a59c4, 1); bg.fillRect(x, 0, 40, GROUND - 40); }
    bg.fillStyle(0xffc94a, 0.18); [2900, 3250, 3600, 3900].forEach(x => bg.fillTriangle(x - 20, 0, x + 20, 0, x + 120, GROUND));
    bg.fillStyle(0xe8b84a, 1); bg.fillRect(2700, GROUND - 40, WORLD - 2700, 8);
    // 가랜드 (전 구간)
    bg.lineStyle(3, 0xffffff, 0.9);
    const cols = [0x8f86ff, 0x3fd1c4, 0xffc94a, 0x9fd3ff];
    for (let x = 0; x < WORLD; x += 160) {
      bg.beginPath(); bg.moveTo(x, 70); bg.lineTo(x + 80, 100); bg.lineTo(x + 160, 70); bg.strokePath();
      for (let i = 1; i < 6; i++) { const fx = x + i * 26, fy = 70 + (i < 3 ? i : 6 - i) * 10; bg.fillStyle(cols[(i + x / 160) % 4 | 0], 1); bg.fillTriangle(fx - 8, fy, fx + 8, fy, fx, fy + 16); }
    }
    // 바닥: 체크무늬
    for (let x = 0; x < WORLD; x += 40) { bg.fillStyle((x / 40) % 2 ? 0xfff6e6 : 0xe9e2ff, 1); bg.fillRect(x, GROUND, 40, H - GROUND); }
    bg.fillStyle(0xd9cff7, 1); bg.fillRect(0, GROUND, WORLD, 5);
    // 구역 표지판
    [[480, '1구역 - 정원 테라스'], [1500, '2구역 - 무도회장'], [2800, '3구역 - 무대']].forEach(([x, name]) => {
      this.add.text(x, 140, name, { fontFamily: FONT, fontSize: 20, color: '#ffffff', fontStyle: 'bold', backgroundColor: '#6a59c4', padding: { x: 10, y: 4 } }).setOrigin(0.5).setDepth(this.D.bg + 1).setAlpha(0.85);
    });
    // 춤추는 손님들 (배경, 전투와 무관)
    const gcols = [0xc9b8ff, 0xa8e6df, 0xffd99a, 0xb8d4ff];
    for (let x = 80; x < WORLD; x += 170) {
      const gst = this.add.image(x, GROUND - 60, 'guest').setTint(Phaser.Utils.Array.GetRandom(gcols)).setAlpha(0.7).setScale(0.9).setDepth(this.D.guest);
      this.tweens.add({ targets: gst, y: GROUND - 66, angle: { from: -6, to: 6 }, duration: 400 + Math.random() * 300, yoyo: true, repeat: -1 });
    }
  }

  // ---------- 적 ----------
  spawnWave(w) {
    const { GROUND } = CFG, def = ENEMY[w.type];
    for (let i = 0; i < w.n; i++) {
      const x = this.cam.scrollX + CFG.W + 40 + i * 90;
      const sp = this.add.image(x, GROUND + def.y, def.tex).setDepth(this.D.enemy);
      if (w.type !== 'boss') sp.setScale(w.type === 'doll' ? 1.15 : 1.2);
      const e = { type: w.type, sp, hp: def.hp, max: def.hp, bob: Math.random() * 6, stop: 380 + i * 90 + (w.type === 'boss' ? 120 : 0), kb: 0, atkT: (w.type === 'servant' ? 2.2 : 1.8) + i * 0.9 };
      if (w.type === 'boss') { this.boss = e; e.cracks = this.add.graphics().setDepth(this.D.enemy + 1); e.crackLv = 0; [this.bossBarBg, this.bossBarLag, this.bossBar, this.bossName].forEach(o => o.setVisible(true)); this.banner('보스 등장!', '#ffffff', 0x6a3fb5); }
      else { e.barBg = this.add.rectangle(x, sp.y - 46, 42, 6, 0x2a2350, 0.5).setDepth(this.D.enemy + 1); e.bar = this.add.rectangle(x - 21, sp.y - 46, 42, 6, 0xff6a9a).setOrigin(0, 0.5).setDepth(this.D.enemy + 1); }
      this.enemies.push(e);
    }
  }
  nearestEnemy(x) { let best = null, d = 1e9; for (const e of this.enemies) { const dd = Math.abs(e.sp.x - x); if (dd < d) { d = dd; best = e; } } return best; }
  hurt(e, amount, byMe, big) {
    if (!e || e.dead) return;
    if (e.groggy > 0) amount = Math.round(amount * 1.5);
    e.hp -= amount; e.sp.setTint(0xffffff); e.flash = 0.08;
    if (byMe) {
      this.stats.damage += amount;
      hitBurst(this, e.sp.x, e.sp.y - (e.type === 'boss' ? 40 : 10), amount, big, this.D.ui - 2);
      e.kb = (e.sp.x > this.me.x ? 1 : -1) * (big ? 26 : 12);
      this.freeze = big ? 0.07 : 0.035;
      big ? SFX.big() : SFX.hit(this.hero.combo);
      if (big) this.cam.shake(90, 0.004);
    }
    if (e.type === 'boss') {
      const r = Math.max(0, e.hp) / e.max;
      this.bossBar.width = 456 * r; this.bossName.setText(`마스케라  ${Math.ceil(r * 100)}%   남은 시간 ${Math.max(0, Math.ceil(ZONES[2].max - this.zt))}초`);
      this.tweens.killTweensOf(this.bossBarLag); this.tweens.add({ targets: this.bossBarLag, width: 456 * r, delay: 250, duration: 300 });
      if (byMe) { this.tweens.add({ targets: e.sp, angle: { from: (big ? 8 : 4) * (Math.random() < 0.5 ? -1 : 1), to: 0 }, scale: { from: big ? 1.08 : 1.04, to: 1 }, duration: 220 }); }
      const lv = r < 0.33 ? 2 : r < 0.66 ? 1 : 0;
      if (lv !== e.crackLv) { e.crackLv = lv; if (lv > 0) { this.popWorld(e.sp.x, e.sp.y - 100, lv === 1 ? '가면에 금이 갔다!' : '가면이 깨지기 직전!', '#ffe9a8'); this.cam.shake(150, 0.006); } }
    }
    else if (e.bar) e.bar.width = 42 * Math.max(0, e.hp) / e.max;
    if (e.hp <= 0) {
      if (e.type === 'boss') { e.hp = 0; this.bossBar.width = 0; this.bossName.setText('마스케라  0%'); this.stats.bossBreaks = 1; this.updateMission(); return; this.stats.bossBreaks = (this.stats.bossBreaks || 0) + 1; this.popWorld(e.sp.x, e.sp.y - 120, '가면 교체!'); return; }
      e.dead = true; this.stats.kills++; SFX.kill(); this.addScore(e.type === 'doll' ? 300 : 100, e.sp.x, e.sp.y - 90);
      if (e.type === 'servant') {
        this.servantKills++;
        if (this.mission && this.mission.id === 'm1' && this.mission.result == null) { const leftN = this.mission.goal - this.servantKills; if (leftN > 0) this.popWorld(e.sp.x, e.sp.y - 60, `하인 가면 ${leftN}개 남음`, '#ffe9a8'); }
      }
      for (let i = 0; i < 12; i++) {
        const d = this.add.image(e.sp.x, e.sp.y, 'confetti').setTint(Phaser.Utils.Array.GetRandom([0xffc94a, 0x8f86ff, 0x3fd1c4])).setDepth(this.D.enemy + 2).setScale(1.4);
        const ang = Math.random() * Math.PI * 2; this.tweens.add({ targets: d, x: d.x + Math.cos(ang) * 70, y: d.y + Math.sin(ang) * 70, angle: 360, alpha: 0, duration: 550, onComplete: () => d.destroy() });
      }
      this.tweens.add({ targets: e.sp, scale: 0, angle: 180, alpha: 0, duration: 220, onComplete: () => e.sp.destroy() });
      if (e.bar) { e.bar.destroy(); e.barBg.destroy(); }
    }
  }
  popWorld(x, y, msg, color = '#ffffff') {
    const m = this.add.text(x, y, msg, { fontFamily: FONT, fontSize: 20, fontStyle: 'bold', color, stroke: '#6a3fb5', strokeThickness: 5 }).setOrigin(0.5).setDepth(this.D.ui - 2);
    this.tweens.add({ targets: m, y: y - 40, alpha: 0, duration: 1300, onComplete: () => m.destroy() });
  }
  banner(msg, color = '#ffffff', bgc = 0x6a3fb5, sub = '') {
    const c = this.add.container(CFG.W / 2, 220).setScrollFactor(0).setDepth(this.D.ui + 5);
    const g = this.add.graphics(); g.fillStyle(bgc, 0.92); g.fillRoundedRect(-200, -38, 400, sub ? 92 : 76, 18);
    c.add(g); c.add(this.add.text(0, 0, msg, { fontFamily: FONT, fontSize: 32, fontStyle: 'bold', color }).setOrigin(0.5));
    if (sub) c.add(this.add.text(0, 34, sub, { fontFamily: FONT, fontSize: 15, color: '#ffffff' }).setOrigin(0.5));
    c.setScale(0.6); this.tweens.add({ targets: c, scale: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: c, alpha: 0, delay: 1300, duration: 300, onComplete: () => c.destroy() });
  }

  // ---------- 아군 스킬: 가장 가까운 적을 노림 ----------
  allyCast(a) {
    const target = this.nearestEnemy(a.sprite.x);
    const col = Phaser.Utils.Array.GetRandom(this.allyPalette);   // 두 안 모두 무작위 색. B안 팔레트에는 빨간 계열만 없음 (규칙 ②)
    const al = this.allyAlpha, D = this.D.allyFx;
    const bx = target ? target.sp.x : a.sprite.x + 200, by = target ? target.sp.y : CFG.GROUND - 80;
    if (a.skill === 'cards') {
      for (let i = 0; i < 8; i++) {
        const c = this.add.image(a.sprite.x, a.sprite.y - 20, 'card').setTint(col).setAlpha(al).setDepth(D);
        this.tweens.add({ targets: c, x: bx + Phaser.Math.Between(-60, 60), y: by + Phaser.Math.Between(-50, 50), angle: 540, alpha: 0, duration: 600, delay: i * 30, onComplete: () => c.destroy() });
      }
      this.time.delayedCall(450, () => { const p = this.add.circle(bx, by, 20, col, al * 0.7).setDepth(D); this.tweens.add({ targets: p, radius: 100, alpha: 0, duration: 600, onComplete: () => p.destroy() }); });
    } else if (a.skill === 'ribbon') {
      const x = a.sprite.x + Phaser.Math.Between(40, 200);
      const e = this.add.ellipse(x, CFG.GROUND, 40, 16, col, al * 0.45).setStrokeStyle(4, col, al).setDepth(D);
      this.tweens.add({ targets: e, width: 240, height: 44, alpha: 0, duration: 900, onComplete: () => e.destroy() });
      for (let i = 0; i < 10; i++) {
        const d = this.add.image(x, CFG.GROUND - 30, 'dot').setTint(col).setAlpha(al).setScale(0.9).setDepth(D);
        const ang = (i / 10) * Math.PI * 2;
        this.tweens.add({ targets: d, x: x + Math.cos(ang) * 120, y: CFG.GROUND - 60 + Math.sin(ang) * 50, alpha: 0, duration: 700, onComplete: () => d.destroy() });
      }
    } else if (a.skill === 'fireworks') {
      const fx = bx + Phaser.Math.Between(-150, 100), fy = Phaser.Math.Between(130, 300);
      for (let i = 0; i < 16; i++) {
        const c = i % 2 ? col : Phaser.Utils.Array.GetRandom(this.allyPalette);
        const d = this.add.image(fx, fy, 'confetti').setTint(c).setAlpha(al).setScale(1.6).setDepth(D);
        const ang = (i / 16) * Math.PI * 2, r = 90 + Math.random() * 60;
        this.tweens.add({ targets: d, x: fx + Math.cos(ang) * r, y: fy + Math.sin(ang) * r + 40, angle: 360, alpha: 0, duration: 800, onComplete: () => d.destroy() });
      }
    } else if (a.skill === 'notes') {
      for (let i = 0; i < 6; i++) {
        const n = this.add.image(a.sprite.x, a.sprite.y - 30, 'note').setTint(col).setAlpha(al).setScale(1.3).setDepth(D);
        this.tweens.add({ targets: n, x: a.sprite.x + Phaser.Math.Between(-60, 260), y: a.sprite.y - Phaser.Math.Between(60, 200), alpha: 0, duration: 900, delay: i * 60, onComplete: () => n.destroy() });
      }
      const w = this.add.circle(a.sprite.x, a.sprite.y, 20, col, 0).setStrokeStyle(4, col, al).setDepth(D);
      this.tweens.add({ targets: w, radius: 180, alpha: 0, duration: 800, onComplete: () => w.destroy() });
    } else if (a.skill === 'shield') {
      const b = this.add.rectangle(a.sprite.x, a.sprite.y, 30, 70, col, al * 0.6).setDepth(D);
      this.tweens.add({ targets: b, x: bx, scaleX: 3, alpha: 0, duration: 500, onComplete: () => b.destroy() });
      if (this.shield <= 0 && this.t >= (this.shieldCdUntil || 0) && Math.random() < 0.12) { this.shieldCdUntil = this.t + 15; this.giveShield(a); }
    }
    if (target && Math.abs(target.sp.x - a.sprite.x) < 520) this.hurt(target, target.type === 'boss' ? 2 : 3, false);
  }

  // ---------- 위험 패턴 ----------
  teleMark(x, y, text, color = '#ff2d55') {
    if (!this.B) return null;
    return this.add.text(x, y, text, { fontFamily: FONT, fontSize: 28, fontStyle: 'bold', color, stroke: '#ffffff', strokeThickness: 4 }).setOrigin(0.5).setDepth(this.D.danger);
  }
  teleStyle(shape) {
    if (this.B) shape.setFillStyle(CFG.DANGER, 0.28).setStrokeStyle(5, CFG.DANGER, 1);
    else { const col = Phaser.Utils.Array.GetRandom(this.allyPalette); shape.setFillStyle(col, 0.33).setStrokeStyle(2, col, 0.7); }
    this.tweens.add({ targets: shape, alpha: { from: 0.5, to: 1 }, duration: 180, yoyo: true, repeat: -1 });
    return shape;

  spawn(p) {

  checkHit(h) {

    if (h.type === 'chandelier') return Math.abs(me.x - h.x) < h.w / 2 + 10;

  enrage() {   // 보스 2페이즈: HP 절반 아래에서 남은 패턴 간격 20% 단축 (색은 보라, 빨강은 쓰지 않음)

  giveShield(from) {   // 기사가 나에게 보호막을 줌 (두 안 동일)
    this.shield = 4; this.shieldFx.setVisible(true).setScale(0.3).setAlpha(1);
    this.tweens.add({ targets: this.shieldFx, scale: 0.95, duration: 250, ease: 'Back.out' });

    this.tweens.add({ targets: fly, x: this.me.x, y: this.me.y - 40, duration: 300, onComplete: () => fly.destroy() });
    this.popWorld(this.me.x, this.me.y - 90, '보호막 받음! (1번 막아 줌)', '#ffe066');
    SFX.tone(660, 0.12, 'triangle', 0.05); setTimeout(() => SFX.tone(990, 0.12, 'triangle', 0.05), 80);
    this.shieldHud.setVisible(true);

  addScore(n, x, y, label) {
    this.score += n;
    if (x != null) this.popWorld(x, y, (n > 0 ? '+' : '') + n + (label ? ' ' + label : ''), n > 0 ? '#ffe14f' : '#ff6a7a');
  }
  popTextCenter(msg) {
    const m = this.add.text(CFG.W / 2, 150, msg, { fontFamily: FONT, fontSize: 22, fontStyle: 'bold', color: '#ffffff', stroke: '#6a3fb5', strokeThickness: 5 }).setOrigin(0.5).setScrollFactor(0).setDepth(this.D.ui);
    this.tweens.add({ targets: m, alpha: 0, y: 130, delay: 600, duration: 600, onComplete: () => m.destroy() });
  }

  update(time, ms) {
    let dt = Math.min(ms / 1000, 0.05);
    const { GROUND, WORLD, W } = CFG;
    if (!this.ready || this.done) return;
    if (this.freeze > 0) { this.freeze -= dt; return; }   // 타격 순간 아주 잠깐 멈춤 (손맛)
    this.t += dt;
    if (this.zone < 0) this.startZone(0);
    const Z = ZONES[this.zone];
    this.hitText.setText(`맞은 횟수 ${this.stats.hitsDanger}   준 피해 ${this.stats.damage}`);
    this.scoreText.setText(`${Math.max(0, Math.round(this.shownScore = (this.shownScore || 0) + (this.score - (this.shownScore || 0)) * Math.min(1, dt * 8)))}점`);
    this.spinIcon.setText(this.hero.spinCd > 0 ? `회전 베기(C) ${Math.ceil(this.hero.spinCd)}초` : '회전 베기(C) 준비!');
    this.itemIcon.setText(this.items > 0 ? `황금 망치(V) ${this.items}개 남음` : '황금 망치(V) 다 씀');
    this.timerText.setText(`${Z.name}`);
    if (this.cue) { this.cue.setPosition(Phaser.Math.Clamp(this.me.x, this.cam.scrollX + 135, this.cam.scrollX + CFG.W - 135), this.me.y - 118); this.cueT -= dt; if (this.cueT <= 0) { this.cue.destroy(); this.cue = null; } }
    if (this.boss && this.boss.hp > 0 && this.zone === 2 && !this.rage && this.boss.hp / this.boss.max < 0.5) this.enrage();
    if (this.boss && this.boss.hp > 0 && this.zone === 2) this.bossName.setText(`마스케라  ${Math.ceil(this.boss.hp / this.boss.max * 100)}%   남은 시간 ${Math.max(0, Math.ceil(ZONES[2].max - this.zt))}초`);

    // 라운드 끝
    if (this.ending > 0) { this.ending -= dt; if (this.ending <= 0) return this.finish(); return; }

    if (this.transT > 0) {   // 다음 구역으로 이동 중
      this.transT -= dt;
      const nx = ZONES[this.zone + 1].x0, k = 1 - Math.max(0, this.transT) / TRANS_SEC, e = k * k * (3 - 2 * k);
      this.cam.scrollX = this.camFrom + (nx - this.camFrom) * e;
      if (this.transT <= 0) { this.zoneDone = false; this.zoneEndAt = null; this.startZone(this.zone + 1); }
    } else if (!this.zoneDone && this.ending <= 0) {
      this.zt += dt;
      this.cam.scrollX = Z.x0 + Z.drift * Math.min(1, this.zt / Z.max);
      while (this.next < this.schedule.length && this.schedule[this.next].t <= this.zt) { const p = this.schedule[this.next++]; p.type.split('+').forEach((type, k) => { const q = { ...p, type, off: k ? -p.off - 90 : p.off }; if (DANGER_TYPES.includes(type)) this.dangerSeen++; this.spawn(q); }); }   // '+'는 두 패턴 동시 (조합)
      while (this.waveIdx < Z.waves.length && Z.waves[this.waveIdx].t <= this.zt) this.spawnWave(Z.waves[this.waveIdx++]);
      this.updateMission();
      const timeUp = this.zt >= Z.max;
      if (timeUp && this.mission.result == null) this.endMission(this.mission, this.mission.id === 'm2' ? !this.mission.failed : false);
      if ((this.zoneEndAt != null && this.zt >= this.zoneEndAt) || (timeUp && this.zoneEndAt == null)) this.endZone();
      else if (timeUp && this.zt >= this.zoneEndAt) this.endZone();
    }
    this.moving = this.transT > 0 || this.zoneDone;
    const left0 = this.cam.scrollX;

    for (const e of this.enemies) {
      if (e.flash > 0) { e.flash -= dt; if (e.flash <= 0) e.sp.clearTint(); }
      if (e.dead) continue;
      if (e.groggy > 0) { e.groggy -= dt; if (e.flash <= 0) e.sp.setTint(e.groggy > 0 ? 0xfff2b0 : 0xffffff); if (e.groggy <= 0) e.sp.clearTint(); }
      else if (e.type === 'boss' && this.bossTintRage && e.flash <= 0) e.sp.setTint(this.bossTintRage);
      const busy = e.type === 'boss' && this.hazards.some(h => h.type === 'dash' && h.active > 0);
      if (busy) continue;
      if (e.kb) { e.sp.x += e.kb; e.stop += e.kb; e.kb = 0; e.stop = Phaser.Math.Clamp(e.stop, 200, 900); }
      const tx = left0 + e.stop + (e.type === 'boss' ? 0 : Math.sin(this.t * 1.5 + e.bob) * 30);
      e.sp.x += (tx - e.sp.x) * Math.min(1, dt * 1.5);
      e.bob += dt;
      if (e.type === 'boss') {
        e.sp.y = GROUND - 140 + Math.sin(e.bob * 2.5) * 8;
        const c = e.cracks; c.clear();
        if (e.crackLv > 0) {
          c.lineStyle(4, 0x1d1830, 1); const bx = e.sp.x - 90, by = e.sp.y - 93;
          c.beginPath(); c.moveTo(bx + 70, by + 50); c.lineTo(bx + 82, by + 72); c.lineTo(bx + 74, by + 90); c.lineTo(bx + 90, by + 112); c.strokePath();
          if (e.crackLv > 1) { c.beginPath(); c.moveTo(bx + 120, by + 48); c.lineTo(bx + 108, by + 70); c.lineTo(bx + 122, by + 92); c.lineTo(bx + 112, by + 110); c.moveTo(bx + 30, by + 80); c.lineTo(bx + 50, by + 86); c.strokePath(); }
        }
      }
      else { e.sp.y = GROUND + ENEMY[e.type].y - Math.abs(Math.sin(e.bob * 5)) * 5; const by = e.sp.y - (e.type === 'doll' ? 56 : 44); e.barBg.setPosition(e.sp.x, by); e.bar.setPosition(e.sp.x - 21, by); }
      e.sp.flipX = e.sp.x > this.me.x;
      if (e.type !== 'boss' && !this.moving) { e.atkT -= dt; if (e.atkT <= 0 && this.hazards.some(h => PATTERN_TYPES.includes(h.type))) e.atkT = 0.6; if (e.atkT <= 0) { this.enemyAttack(e); e.atkT = e.type === 'servant' ? 3.6 : 3.2; } }
    }
    this.enemies = this.enemies.filter(e => !e.dead);

    for (const a of this.allies) {
      const tx = Phaser.Math.Clamp(this.me.x + a.off, left0 + 20, left0 + W - 20);
      a.sprite.x += (tx - a.sprite.x) * Math.min(1, dt * 2.2);
      a.bob += dt * 6; a.sprite.y = GROUND - 35 - Math.abs(Math.sin(a.bob)) * 6;
      a.cd -= dt;
      if (a.cd <= 0) { this.allyCast(a); a.cd = 0.5 + Math.random() * 0.6; }
    }

    // 나
    if (this.downT > 0) {
      this.downT -= dt; this.me.x = Phaser.Math.Clamp(this.me.x, left0 + 24, left0 + W - 40);
      if (this.downT <= 0) { this.hp = 50; this.hpUI.set(50); this.me.setAngle(0); this.hero.invuln = 1.2; this.popWorld(this.me.x, this.me.y - 70, '회복!', '#3fd18a'); }
    } else {
      if (Phaser.Input.Keyboard.JustDown(this.hero.keys.V) && this.items > 0 && this.ready && !this.done) this.useItem();
      this.hero.update(dt, left0 + 24, left0 + W - 40,
        (dmg, combo, face) => { for (const e of this.enemies) { const dx = (e.sp.x - this.me.x) * face, reach = e.type === 'boss' ? 170 : 110; if (dx > -30 && dx < reach) this.hurt(e, dmg, true, combo === 3); } },
        () => { for (const e of this.enemies) if (Math.abs(e.sp.x - this.me.x) < (e.type === 'boss' ? 260 : 180)) this.hurt(e, e.type === 'boss' ? 150 : 120, true, true); });
    }
    if (this.shield > 0) {
      this.shield -= dt; this.shieldFx.setPosition(this.me.x, this.me.y - 4).setAngle(this.shieldFx.angle + dt * 40);
      this.shieldHudText.setText(`보호막 ${Math.ceil(this.shield)}초`);
      if (this.shield < 1) this.shieldFx.setAlpha(Math.floor(this.t * 10) % 2 ? 0.3 : 1);
      if (this.shield <= 0) { this.shieldFx.setVisible(false).setAlpha(1); this.shieldHud.setVisible(false); }
    }

    for (const h of this.hazards) {
      if (!h.active) { h.t -= dt; if (h.t <= 0) this.fire(h); continue; }
      h.active -= dt;
      if (!h.hitDone && this.checkHit(h) && this.hero.invuln <= 0 && this.hero.dashT <= 0 && this.downT <= 0) { h.hitDone = true; this.takeHit(h.type); }
      if (h.active <= 0) {
        h.dead = true; (Array.isArray(h.g) ? h.g : [h.g]).forEach(g => this.tweens.add({ targets: g, alpha: 0, duration: 150, onComplete: () => g.destroy() }));
        if (!h.hitDone && this.downT <= 0) {   // 안 맞고 넘겼으면 연속 회피
          this.streak++; this.bestStreak = Math.max(this.bestStreak, this.streak);
          const bonus = 20 * Math.min(this.streak, 10); this.score += bonus;
          this.streakText.setText(`연속 회피 ${this.streak}  +${bonus}`).setAlpha(1).setScale(1.25);
          this.tweens.killTweensOf(this.streakText); this.tweens.add({ targets: this.streakText, scale: 1, duration: 150 }); this.tweens.add({ targets: this.streakText, alpha: 0, delay: 900, duration: 400 });
        }
      }
    }
    this.hazards = this.hazards.filter(h => !h.dead);
  }

  finish() {
    this.done = true; LOG.current = null;
    const r = { round: this.index + 1, mode: this.mode, dangerSeen: this.dangerSeen, hitRate: this.dangerSeen ? Math.round((this.stats.hitsDanger + this.stats.shieldBlocks) / this.dangerSeen * 1000) / 10 : 0, hpHitRate: this.dangerSeen ? Math.round(this.stats.hitsDanger / this.dangerSeen * 1000) / 10 : 0, roundSec: Math.round(this.t * 10) / 10, score: this.score, bestStreak: this.bestStreak, ...this.stats, attacks: this.hero.events.attacks, dashes: this.hero.events.dashes, spins: this.hero.events.spins };
    LOG.rounds.push(r);
    this.scene.start('Survey', { index: this.index, result: r });
  }
}

class SurveyScene extends Phaser.Scene {
  constructor() { super('Survey'); }
  init(d) { this.index = d.index; this.result = d.result; }
  create() {
    const { W, H } = CFG;
    this.add.rectangle(W / 2, H / 2, W, H, 0x2a2350);
    this.add.text(W / 2, 50, `라운드 ${this.index + 1} 끝!   위험 공격 ${this.result.dangerSeen}번 중 ${this.result.hitsDanger}번 맞음   미션 성공 ${Object.values(this.result.missions).reduce((a, b) => a + b, 0)}/3`, { fontFamily: FONT, fontSize: 22, color: '#ffc94a' }).setOrigin(0.5);
    this.qs = [
      { q: 'Q1. 싸우는 동안 내 캐릭터가 어디 있는지 놓친 순간이 있었나요?', opts: ['1  없었다', '2  1~2번 있었다', '3  여러 번 있었다'], key: 'lostSelf' },
      { q: 'Q2. 피해야 하는 공격과 그냥 연출을 구분하기 쉬웠나요?', opts: ['1  매우 어려웠다', '2  어려웠다', '3  보통', '4  쉬웠다', '5  매우 쉬웠다'], key: 'clarity' },
    ];
    this.answers = {}; this.step = 0;
    this.qText = this.add.text(W / 2, 160, '', { fontFamily: FONT, fontSize: 22, color: '#ffffff', align: 'center', wordWrap: { width: 860 } }).setOrigin(0.5);
    this.optTexts = [];
    this.show();
    this.input.keyboard.on('keydown', (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= this.qs[this.step].opts.length) this.answer(n); });
  }
  show() {
    this.optTexts.forEach(t => t.destroy()); this.optTexts = [];
    const q = this.qs[this.step];
    this.qText.setText(q.q + '\n(숫자 키 또는 클릭)');
    q.opts.forEach((o, i) => {
      const t = this.add.text(CFG.W / 2, 240 + i * 46, o, { fontFamily: FONT, fontSize: 22, color: '#e6e0ff', backgroundColor: '#3d3470', padding: { x: 16, y: 6 } })
        .setOrigin(0.5).setInteractive({ useHandCursor: true });
      t.on('pointerdown', () => this.answer(i + 1));
      this.optTexts.push(t);
    });
  }
  answer(n) {
    this.answers[this.qs[this.step].key] = n;
    this.step++;
    if (this.step < this.qs.length) return this.show();
    Object.assign(this.result, this.answers);
    LOG.send('pp_round_end', this.result); SFX.ok();
    if (this.index === 0) this.scene.start('Round', { index: 1 });
    else this.scene.start('Final');
  }
}

class FinalScene extends Phaser.Scene {
  constructor() { super('Final'); }
  create() {
    const { W, H } = CFG;
    this.add.rectangle(W / 2, H / 2, W, H, 0x2a2350);
    const [r1, r2] = LOG.rounds;
    this.add.text(W / 2, 60, '마지막 질문', { fontFamily: FONT, fontSize: 30, color: '#ffc94a' }).setOrigin(0.5);
    this.add.text(W / 2, 120, `라운드 1: ${r1.dangerSeen}번 중 ${r1.dangerSeen - r1.hitsDanger - r1.shieldBlocks}번 피함    라운드 2: ${r2.dangerSeen}번 중 ${r2.dangerSeen - r2.hitsDanger - r2.shieldBlocks}번 피함`, { fontFamily: FONT, fontSize: 22, color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 190, 'Q3. 어느 라운드가 더 플레이하기 편했나요?', { fontFamily: FONT, fontSize: 22, color: '#ffffff' }).setOrigin(0.5);
    const pick = (n) => {
      if (this.picked) return; this.picked = true;
      const prefer = n === 3 ? 'same' : LOG.order[n - 1];
      LOG.send('pp_session_end', { order: LOG.order, prefer, r1, r2 });
      this.add.text(W / 2, 460, '참여해 주셔서 감사합니다! 창을 닫으셔도 됩니다.', { fontFamily: FONT, fontSize: 22, color: '#ffc94a' }).setOrigin(0.5);
    };
    ['1  라운드 1', '2  라운드 2', '3  비슷했다'].forEach((o, i) => {
      const t = this.add.text(W / 2, 260 + i * 50, o, { fontFamily: FONT, fontSize: 22, color: '#e6e0ff', backgroundColor: '#3d3470', padding: { x: 16, y: 6 } })
        .setOrigin(0.5).setInteractive({ useHandCursor: true });
      t.on('pointerdown', () => pick(i + 1));
    });
    this.input.keyboard.on('keydown', (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 3) pick(n); });
  }
}

// 중간에 창을 닫으면 어디까지 했는지 남김 (이탈 지점 확인용)
window.addEventListener('pagehide', () => {
  const r = LOG.current; if (!r || r.done || LOG.quitSent) return; LOG.quitSent = true;
  LOG.send('pp_quit', { round: r.index + 1, mode: r.mode, zone: r.zone + 1, zoneSec: Math.round((r.zt || 0) * 10) / 10, dangerSeen: r.dangerSeen, hitsDanger: r.stats.hitsDanger, shieldBlocks: r.stats.shieldBlocks });
});
// 휴대폰은 키보드가 없어 플레이할 수 없음 → 안내만 보여 주고 시작하지 않음
const isPhone = matchMedia('(pointer: coarse)').matches && !matchMedia('(pointer: fine)').matches;
if (isPhone) {
  document.getElementById('game').innerHTML = '<div style="color:#fff;font-family:sans-serif;text-align:center;padding:60px 24px;line-height:1.7"><div style="font-size:28px;font-weight:700;margin-bottom:12px">PANIC PARTY</div>키보드로 하는 게임이라<br><b>PC(크롬 추천)</b>에서 열어 주세요!<br><br><span style="opacity:.7;font-size:14px">hwasun-zip.github.io/panic-party</span></div>';
  try { LOG.init && !LOG.player && LOG.init(); LOG.send('pp_mobile_block', { ua: navigator.userAgent.slice(0, 120) }); } catch (e) {}
} else new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: CFG.W, height: CFG.H, backgroundColor: '#2a2350',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [TitleScene, TutorialScene, RoundScene, SurveyScene, FinalScene],
});
</script>
