<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PANIC PARTY | 혼돈 속에서 나를 찾아라</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0618; overflow: hidden; }
  #game { width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="game"></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script>
// =====================================================================
// PANIC PARTY: 파티 던전에서 "화면 정보의 우선순위"가 플레이에 주는 영향을 비교하는 프로토타입
// - A안: 우선순위 없음 (모든 이펙트가 같은 강도, 위험 예고 색이 제각각, 내 캐릭터 표시 없음)
// - B안: ① 위험 예고 언어 통일 ② 내 캐릭터 우선 표시 ③ 이펙트 레이어 우선순위 (중요 아군 이펙트는 최소 투명도 유지)
// - 두 안은 보스 패턴 순서와 타이밍이 완전히 같고, "보이는 방식"만 다릅니다.
// - 모든 그래픽은 도형으로 직접 그린 오리지널입니다.
// =====================================================================
const CFG = {
  version: 'PP-1.0',
  W: 960, H: 540, GROUND: 450,
  ROUND_SEC: 60,
  endpoint: 'https://script.google.com/macros/s/AKfycbzRPIcB805fQv0X2EKGOGoE0JdrMudX7-HEzIzF9UJhyEdXejciDMcgw_TlgoGMNreUQg/exec',
  DANGER: 0xff2d55,
};

// ---------- 기록 ----------
const LOG = {
  init() {
    const p = new URLSearchParams(location.search);
    this.debug = p.get('debug') === '1';
    this.player = this.store('pp_player') || this.store('pp_player', Math.random().toString(36).slice(2, 10));
    let order = p.get('order');
    if (order !== 'AB' && order !== 'BA') order = Math.random() < 0.5 ? 'AB' : 'BA';
    this.order = order;
    this.session = Math.random().toString(36).slice(2, 10);
    this.rounds = [];
    this.send('pp_session_start', { order });
  },
  store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {} return v; },
  send(event, data = {}) {
    const rec = { time: new Date().toISOString(), player: this.player, session: this.session, group: this.order,
      version: CFG.version, debug: this.debug ? 1 : 0, event, pattern_hits: data };
    if (this.debug) console.log('[PS]', rec);
    if (!CFG.endpoint) return;
    try { fetch(CFG.endpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(rec) }).catch(() => {}); } catch (e) {}
  },
};

// ---------- 보스 패턴 일정 (두 라운드가 완전히 같음) ----------
// t: 시작 초, type: slam(장판, 위험) / laser(낮은 레이저, 위험, 점프로 회피) / roar(화려하지만 무해)
function makeSchedule() {
  const s = []; let t = 3; let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  const types = ['slam', 'laser', 'roar', 'slam', 'slam', 'laser', 'roar', 'slam', 'laser', 'slam', 'roar', 'laser', 'slam', 'slam', 'laser', 'roar', 'slam', 'laser'];
  for (const type of types) {
    if (t > CFG.ROUND_SEC - 3) break;
    s.push({ t, type, off: Math.round(rnd() * 120 - 60) });
    t += 2.6 + rnd() * 0.9;
  }
  return s;
}

// ---------- 텍스처 (모두 도형으로 직접 그린 오리지널: 가면무도회 파티) ----------
function makeTextures(scene) {
  const g = scene.make.graphics({ add: false });
  const mask = (cx, cy, col, trim) => {        // 눈가 가면
    g.fillStyle(col, 1); g.fillEllipse(cx - 6, cy, 13, 8); g.fillEllipse(cx + 6, cy, 13, 8); g.fillRect(cx - 4, cy - 2, 8, 4);
    g.fillStyle(0x1d1830, 1); g.fillEllipse(cx - 6, cy, 6, 3); g.fillEllipse(cx + 6, cy, 6, 3);
    if (trim) { g.lineStyle(1.5, trim, 1); g.strokeEllipse(cx - 6, cy, 13, 8); g.strokeEllipse(cx + 6, cy, 13, 8); }
  };
  const face = (cx, cy) => { g.fillStyle(0xf6dcc4, 1); g.fillCircle(cx, cy, 10); };
  const shoes = (c) => { g.fillStyle(c, 1); g.fillRoundedRect(13, 50, 8, 7, 3); g.fillRoundedRect(25, 50, 8, 7, 3); };

  // 나: 흰 연미복 + 금색 가면 + 남색 망토
  g.clear();
  g.fillStyle(0x2b3a7a, 1); g.fillTriangle(8, 52, 23, 24, 38, 52);                 // 망토
  g.fillStyle(0xf7f5f0, 1); g.fillRoundedRect(13, 26, 20, 26, 6);                // 연미복
  g.fillStyle(0xd9a43a, 1); g.fillTriangle(20, 28, 26, 28, 23, 34);              // 금색 나비넥타이
  face(23, 17);
  g.fillStyle(0x3a2a20, 1); g.fillEllipse(23, 9, 22, 9);                          // 머리카락
  mask(23, 17, 0xe8b84a, 0xfff1c2);
  shoes(0x2b2440);
  g.generateTexture('me', 46, 58);

  // 마술사: 실크햇 + 보라 망토 + 흰 가면
  g.clear();
  g.fillStyle(0x5b4bc4, 1); g.fillTriangle(6, 54, 23, 24, 40, 54);
  g.fillStyle(0x23203a, 1); g.fillRoundedRect(15, 28, 16, 22, 5);
  face(23, 19); mask(23, 19, 0xffffff, 0x8f86ff);
  g.fillStyle(0x23203a, 1); g.fillRect(14, 0, 18, 12); g.fillRect(10, 10, 26, 3);   // 실크햇
  g.fillStyle(0x8f86ff, 1); g.fillRect(14, 8, 18, 2);
  shoes(0x23203a);
  g.generateTexture('ally1', 46, 58);

  // 댄서: 청록 드레스 + 깃털 가면
  g.clear();
  g.fillStyle(0x2fb8ab, 1); g.fillTriangle(5, 54, 23, 26, 41, 54);
  g.fillStyle(0x23a094, 1); g.fillRoundedRect(17, 26, 12, 12, 4);
  face(23, 18);
  g.fillStyle(0x2b2038, 1); g.fillEllipse(23, 11, 22, 10); g.fillCircle(31, 9, 5);       // 올림머리
  mask(23, 18, 0x9fe8de, 0xffffff);
  g.fillStyle(0xfff6d8, 1); g.fillTriangle(30, 14, 40, 0, 34, 16);                        // 깃털
  g.generateTexture('ally2', 46, 58);

  // 광대(불꽃놀이 담당): 두 갈래 모자 + 노랑/남색 옷
  g.clear();
  g.fillStyle(0xffc94a, 1); g.fillRoundedRect(13, 26, 10, 24, 4); g.fillStyle(0x34407f, 1); g.fillRoundedRect(23, 26, 10, 24, 4);
  face(23, 18); mask(23, 18, 0x34407f, 0xffc94a);
  g.fillStyle(0xffc94a, 1); g.fillTriangle(12, 12, 6, 0, 23, 10); g.fillStyle(0x34407f, 1); g.fillTriangle(34, 12, 40, 0, 23, 10);
  g.fillStyle(0xfff1c2, 1); g.fillCircle(6, 1, 3); g.fillCircle(40, 1, 3);
  shoes(0x34407f);
  g.generateTexture('ally3', 46, 58);

  // 내 캐릭터 실루엣 (외곽선용)
  g.clear(); g.fillStyle(0xffffff, 1);
  g.fillTriangle(8, 52, 23, 24, 38, 52); g.fillCircle(23, 15, 12); g.fillRoundedRect(13, 26, 20, 26, 6);
  g.fillRoundedRect(13, 50, 8, 7, 3); g.fillRoundedRect(25, 50, 8, 7, 3);
  g.generateTexture('meShape', 46, 58);

  // 보스: 무도회의 거대 가면 "마스케라"
  g.clear();
  g.fillStyle(0xfff1c2, 1); g.fillTriangle(20, 40, 40, 0, 56, 38); g.fillTriangle(124, 38, 140, 0, 160, 40);   // 깃털
  g.fillStyle(0x8f86ff, 1); g.fillTriangle(48, 36, 70, 2, 84, 34); g.fillTriangle(96, 34, 110, 2, 132, 36);
  g.fillStyle(0x6a3fb5, 1); g.fillEllipse(56, 80, 100, 70); g.fillEllipse(124, 80, 100, 70); g.fillRect(70, 60, 40, 30);   // 가면 몸
  g.lineStyle(5, 0xe8b84a, 1); g.strokeEllipse(56, 80, 100, 70); g.strokeEllipse(124, 80, 100, 70);
  g.fillStyle(0x1d1830, 1); g.fillEllipse(58, 80, 44, 20); g.fillEllipse(122, 80, 44, 20);                     // 눈 구멍
  g.fillStyle(0xffe680, 1); g.fillCircle(58, 80, 6); g.fillCircle(122, 80, 6);                                   // 빛나는 눈
  g.fillStyle(0xe8b84a, 1); g.fillCircle(90, 70, 7);                                                              // 보석
  g.lineStyle(4, 0xe8b84a, 1); g.lineBetween(90, 112, 90, 176); g.fillStyle(0xe8b84a, 1); g.fillCircle(90, 178, 6);   // 손잡이 막대
  g.generateTexture('boss', 180, 186);

  g.clear(); g.fillStyle(0xffffff, 1); g.fillCircle(8, 8, 8); g.generateTexture('dot', 16, 16);
  g.clear(); g.fillStyle(0xffffff, 1); g.fillRoundedRect(0, 0, 12, 16, 2); g.generateTexture('card', 12, 16);
  g.clear(); g.fillStyle(0xffffff, 1); g.fillRect(0, 0, 8, 5); g.generateTexture('confetti', 8, 5);
  g.destroy();
}

// =====================================================================
class TitleScene extends Phaser.Scene {
  constructor() { super('Title'); }
  create() {
    makeTextures(this);
    LOG.init();
    const { W, H } = CFG;
    this.add.rectangle(W / 2, H / 2, W, H, 0x2a2350);
    this.add.text(W / 2, 70, 'PANIC PARTY', { fontFamily: 'sans-serif', fontSize: 44, fontStyle: 'bold', color: '#ffc94a' }).setOrigin(0.5);
    this.add.text(W / 2, 112, '혼돈 속에서 나를 찾아라 (약 3분)', { fontFamily: 'sans-serif', fontSize: 20, color: '#c9c2ff' }).setOrigin(0.5);
    const lines = [
      '가면무도회에 나타난 거대 가면 "마스케라"를 마술사, 댄서, 광대와 함께 물리치세요.',
      '60초 라운드를 2번 합니다. 두 라운드는 화면이 조금 다릅니다.',
      '',
      '목표: 보스의 위험한 공격을 최대한 피하세요. (쓰러지지는 않습니다)',
      '',
      '← → 이동    ↑ 또는 Space 점프    X 대시(잠깐 무적)    Z 공격',
      '',
      '라운드가 끝나면 짧은 질문 2개에 답해 주세요.',
    ];
    this.add.text(W / 2, 290, lines.join('\n'), { fontFamily: 'sans-serif', fontSize: 19, color: '#ffffff', align: 'center', lineSpacing: 8 }).setOrigin(0.5);
    const start = this.add.text(W / 2, 470, '[ Enter 또는 클릭으로 시작 ]', { fontFamily: 'sans-serif', fontSize: 22, color: '#ffe14f' }).setOrigin(0.5);
    this.tweens.add({ targets: start, alpha: 0.4, duration: 700, yoyo: true, repeat: -1 });
    const go = () => this.scene.start('Round', { index: 0 });
    this.input.keyboard.once('keydown-ENTER', go);
    this.input.once('pointerdown', go);
  }
}

// =====================================================================
class RoundScene extends Phaser.Scene {
  constructor() { super('Round'); }
  init(data) {
    this.index = data.index;
    this.mode = LOG.order[this.index];          // 'A' 또는 'B'
    this.B = this.mode === 'B';
  }
  create() {
    const { W, H, GROUND } = CFG;
    this.t = 0; this.done = false;
    this.stats = { hitsDanger: 0, hitsSlam: 0, hitsLaser: 0, shieldBlocks: 0, dashes: 0, attacks: 0, dodgedNear: 0 };
    this.schedule = makeSchedule(); this.next = 0;
    this.hazards = [];

    // 깊이(레이어) 규칙: B안은 위험 예고 > 내 캐릭터 > 보스 > 아군 이펙트, A안은 아군 이펙트가 모든 것 위
    this.D = this.B
      ? { bg: 0, boss: 10, allyFx: 20, ally: 25, me: 40, danger: 50, ui: 100 }
      : { bg: 0, boss: 10, danger: 15, ally: 25, me: 30, allyFx: 45, ui: 100 };

    // 배경: 밝고 화사한 가면무도회장 (파스텔 하늘색과 라일락, 크림색 체크 바닥)
    const bg = this.add.graphics().setDepth(this.D.bg);
    bg.fillGradientStyle(0xbfe3ff, 0xbfe3ff, 0xe6d9ff, 0xe6d9ff, 1); bg.fillRect(0, 0, W, GROUND);
    bg.fillStyle(0xffffff, 0.35);                                              // 아치형 창문
    [140, 400, 660].forEach((x) => { bg.fillRoundedRect(x, 70, 120, 200, { tl: 60, tr: 60, bl: 4, br: 4 }); });
    bg.lineStyle(3, 0xffffff, 0.8);
    for (let x = -20; x < W + 40; x += 160) {                                  // 가랜드 줄과 깃발
      bg.beginPath(); bg.moveTo(x, 30); bg.lineTo(x + 80, 62); bg.lineTo(x + 160, 30); bg.strokePath();
      const cols = [0x8f86ff, 0x3fd1c4, 0xffc94a, 0x9fd3ff];
      for (let i = 1; i < 6; i++) {
        const fx = x + i * 26, fy = 30 + (i < 3 ? i : 6 - i) * 10;
        bg.fillStyle(cols[(i + x / 160) % 4 | 0], 1); bg.fillTriangle(fx - 8, fy, fx + 8, fy, fx, fy + 16);
      }
    }
    for (let i = 0; i < 24; i++) {                                             // 체크무늬 바닥
      bg.fillStyle(i % 2 ? 0xfff6e6 : 0xe9e2ff, 1); bg.fillRect(i * 40, GROUND, 40, H - GROUND);
    }
    bg.fillStyle(0xd9cff7, 1); bg.fillRect(0, GROUND, W, 5);
    [80, 960].forEach((x) => {                                                  // 무대 커튼 (보라)
      bg.fillStyle(0x7d6bd6, 1); bg.fillRect(x - 80, 0, 80, GROUND); bg.fillStyle(0x6a59c4, 1);
      for (let k = 0; k < 4; k++) bg.fillRect(x - 80 + k * 20, 0, 6, GROUND);
    });

    // 보스
    this.boss = this.add.image(790, GROUND - 150, 'boss').setDepth(this.D.boss);
    this.bossHp = 1; this.tweens.add({ targets: this.boss, y: GROUND - 170, duration: 900, yoyo: true, repeat: -1 });

    // 아군 NPC
    this.allies = [
      { key: 'ally1', x: 260, color: 0x6f62e8 },
      { key: 'ally2', x: 420, color: 0x1fb3a5 },
      { key: 'ally3', x: 560, color: 0xe0a21c },
    ].map((a, i) => {
      const s = this.add.image(a.x, GROUND - 35, a.key).setScale(1.2).setDepth(this.D.ally);
      s.flipX = false; a.sprite = s; a.cd = 0.4 + i * 0.3; a.dir = i % 2 ? 1 : -1; a.base = a.x;
      return a;
    });
    // A안은 아군 이펙트 색에 위험 색(빨강 계열)이 섞이고, B안은 위험 색을 아군 연출에 쓰지 않음
    this.allyPalette = this.B
      ? [0x6f62e8, 0x1fb3a5, 0xe0a21c]
      : [0x6f62e8, 0x1fb3a5, 0xe0a21c, 0xff2d55, 0xff4f9a, 0xff6a3d, 0xff3fbf];
    this.allyAlpha = this.B ? 0.32 : 0.95;

    // 나
    this.me = this.add.image(140, GROUND - 35, 'me').setScale(1.2).setDepth(this.D.me);
    this.vx = 0; this.vy = 0; this.onGround = true; this.face = 1;
    this.invuln = 0; this.dashT = 0; this.dashCd = 0; this.atkCd = 0; this.shield = 0;
    if (this.B) {
      // ② 내 캐릭터 우선 표시: 발밑 표식 + 가려질 때도 보이는 외곽선
      this.marker = this.add.ellipse(140, GROUND + 4, 56, 14).setStrokeStyle(3, 0x39ff88, 1).setDepth(this.D.me - 1);
      this.markerArrow = this.add.triangle(140, GROUND - 70, 0, 0, 16, 0, 8, 12, 0x39ff88).setDepth(this.D.me + 1);
      this.outline = this.add.image(140, GROUND - 35, 'meShape').setTint(0x39ff88).setScale(1.42).setAlpha(0.9).setDepth(this.D.me - 0.5);
    }
    this.shieldFx = this.add.circle(0, 0, 34).setStrokeStyle(4, 0xffe9a8, 1).setFillStyle(0xffe9a8, 0.18).setVisible(false)
      .setDepth(this.B ? this.D.me + 2 : this.D.allyFx - 1);

    // UI
    const label = `라운드 ${this.index + 1} / 2`;
    this.add.rectangle(0, 0, CFG.W, 60, 0xffffff, 0.75).setOrigin(0).setDepth(this.D.ui - 1);
    this.add.text(16, 12, label, { fontFamily: 'sans-serif', fontSize: 18, color: '#2a2350', fontStyle: 'bold' }).setDepth(this.D.ui);
    this.timerText = this.add.text(W - 16, 12, '', { fontFamily: 'sans-serif', fontSize: 18, color: '#2a2350', fontStyle: 'bold' }).setOrigin(1, 0).setDepth(this.D.ui);
    this.hitText = this.add.text(16, 36, '', { fontFamily: 'sans-serif', fontSize: 16, color: '#5b4bc4', fontStyle: 'bold' }).setDepth(this.D.ui);
    if (LOG.debug) this.add.text(W / 2, 12, `debug: ${this.mode}안`, { fontFamily: 'sans-serif', fontSize: 14, color: '#888' }).setOrigin(0.5, 0).setDepth(this.D.ui);
    this.ready = false;
    const cd = this.add.text(W / 2, H / 2 - 40, '3', { fontFamily: 'sans-serif', fontSize: 64, fontStyle: 'bold', color: '#2a2350' }).setOrigin(0.5).setDepth(this.D.ui);
    let n = 3;
    this.time.addEvent({ delay: 700, repeat: 3, callback: () => { n--; if (n > 0) cd.setText(String(n)); else if (n === 0) cd.setText('시작!'); else { cd.destroy(); this.ready = true; } } });

    this.keys = this.input.keyboard.addKeys('LEFT,RIGHT,UP,SPACE,X,Z');
    LOG.send('pp_round_start', { round: this.index + 1, mode: this.mode });
  }

  // ---------- 아군 이펙트 ----------
  allyCast(a) {
    // B안: 직업마다 정해진 색 / A안: 위험 색이 섞인 아무 색
    const col = this.B ? a.color : Phaser.Utils.Array.GetRandom(this.allyPalette);
    const x = Phaser.Math.Between(340, 820), y = Phaser.Math.Between(CFG.GROUND - 200, CFG.GROUND - 30);
    const al = this.allyAlpha;
    if (a.key === 'ally1') {          // 마술사: 카드 소나기 + 연기 펑
      for (let i = 0; i < 8; i++) {
        const c = this.add.image(a.sprite.x, a.sprite.y - 20, 'card').setTint(col).setAlpha(al).setDepth(this.D.allyFx);
        this.tweens.add({ targets: c, x: x + Phaser.Math.Between(-90, 90), y: y + Phaser.Math.Between(-60, 60), angle: 540, alpha: 0, duration: 650, delay: i * 30, onComplete: () => c.destroy() });
      }
      const puff = this.add.circle(x, y, 20, col, al * 0.7).setDepth(this.D.allyFx);
      this.tweens.add({ targets: puff, radius: 100, alpha: 0, duration: 700, onComplete: () => puff.destroy() });
    } else if (a.key === 'ally2') {   // 댄서: 바닥을 도는 리본 원 + 반짝이
      const e = this.add.ellipse(x, CFG.GROUND, 40, 16, col, al * 0.45).setStrokeStyle(4, col, al).setDepth(this.D.allyFx);
      this.tweens.add({ targets: e, width: 240, height: 44, alpha: 0, duration: 900, onComplete: () => e.destroy() });
      for (let i = 0; i < 8; i++) {
        const d = this.add.image(x, CFG.GROUND - 30, 'dot').setTint(col).setAlpha(al).setScale(0.9).setDepth(this.D.allyFx);
        const ang = (i / 8) * Math.PI * 2;
        this.tweens.add({ targets: d, x: x + Math.cos(ang) * 110, y: CFG.GROUND - 60 + Math.sin(ang) * 50, alpha: 0, duration: 700, onComplete: () => d.destroy() });
      }
    } else {                          // 광대: 불꽃놀이
      const fy = Phaser.Math.Between(80, 280);
      for (let i = 0; i < 14; i++) {
        const c = i % 2 ? col : Phaser.Utils.Array.GetRandom(this.allyPalette);
        const d = this.add.image(x, fy, 'confetti').setTint(c).setAlpha(al).setScale(1.6).setDepth(this.D.allyFx);
        const ang = (i / 14) * Math.PI * 2, r = 90 + Math.random() * 50;
        this.tweens.add({ targets: d, x: x + Math.cos(ang) * r, y: fy + Math.sin(ang) * r + 40, angle: 360, alpha: 0, duration: 800, onComplete: () => d.destroy() });
      }
    }
    // 가끔 나에게 보호막 (중요한 아군 이펙트: B안에서도 흐려지지 않음)
    if (Math.random() < 0.08 && this.shield <= 0) { this.shield = 4; this.shieldFx.setVisible(true); }
  }

  // ---------- 보스 패턴 ----------
  spawn(p) {
    const { GROUND } = CFG;
    if (p.type === 'slam') {
      const x = Phaser.Math.Clamp(this.me.x + p.off, 60, 900), r = 95, tele = 1.1;
      const h = { type: 'slam', x, r, t: tele, active: 0, hitDone: false };
      if (this.B) {
        h.g = this.add.ellipse(x, GROUND, r * 2, 34, CFG.DANGER, 0.30).setStrokeStyle(5, CFG.DANGER, 1).setDepth(this.D.danger);
        h.bang = this.add.text(x, GROUND - 60, '!', { fontFamily: 'sans-serif', fontSize: 40, fontStyle: 'bold', color: '#ff2d55' }).setOrigin(0.5).setDepth(this.D.danger);
      } else {
        const col = Phaser.Utils.Array.GetRandom(this.allyPalette);
        h.g = this.add.ellipse(x, GROUND, r * 2, 34, col, 0.35).setStrokeStyle(2, col, 0.7).setDepth(this.D.danger);
      }
      this.tweens.add({ targets: h.g, alpha: { from: 0.5, to: 1 }, duration: 180, yoyo: true, repeat: -1 });
      this.hazards.push(h);
    } else if (p.type === 'laser') {
      const y = GROUND - 22, tele = 1.2;
      const h = { type: 'laser', y, t: tele, active: 0, hitDone: false };
      if (this.B) {
        h.g = this.add.rectangle(CFG.W / 2 - 60, y, CFG.W - 120, 26, CFG.DANGER, 0.25).setStrokeStyle(4, CFG.DANGER, 1).setDepth(this.D.danger);
        h.bang = this.add.text(700, y - 40, '! 점프', { fontFamily: 'sans-serif', fontSize: 26, fontStyle: 'bold', color: '#ff2d55' }).setOrigin(0.5).setDepth(this.D.danger);
      } else {
        const col = Phaser.Utils.Array.GetRandom(this.allyPalette);
        h.g = this.add.rectangle(CFG.W / 2 - 60, y, CFG.W - 120, 26, col, 0.3).setStrokeStyle(1, col, 0.6).setDepth(this.D.danger);
      }
      this.hazards.push(h);
    } else { // roar: 화려하지만 무해
      this.cameras.main.shake(350, 0.006);
      const col = this.B ? 0xb9b2d8 : Phaser.Utils.Array.GetRandom(this.allyPalette);
      const al = this.B ? 0.35 : 0.9;
      for (let i = 0; i < 3; i++) {
        const ring = this.add.circle(this.boss.x, this.boss.y, 30, col, 0).setStrokeStyle(8, col, al).setDepth(this.B ? this.D.allyFx : this.D.allyFx);
        this.tweens.add({ targets: ring, radius: 420, alpha: 0, delay: i * 180, duration: 900, onComplete: () => ring.destroy() });
      }
      if (!this.B) { // A안: 바닥에 위험해 보이는 장판까지 뿌림
        for (let i = 0; i < 2; i++) {
          const x = Phaser.Math.Between(120, 760);
          const e = this.add.ellipse(x, GROUND, 160, 30, col, 0.4).setStrokeStyle(2, col, 0.8).setDepth(this.D.allyFx);
          this.tweens.add({ targets: e, alpha: 0, duration: 1300, onComplete: () => e.destroy() });
        }
      }
    }
  }

  takeHit(kind) {
    if (this.invuln > 0 || this.dashT > 0) return;
    if (this.shield > 0) { this.shield = 0; this.shieldFx.setVisible(false); this.stats.shieldBlocks++; this.invuln = 0.6; return; }
    this.stats.hitsDanger++; if (kind === 'slam') this.stats.hitsSlam++; else this.stats.hitsLaser++;
    this.invuln = 0.9; this.cameras.main.flash(120, 255, 60, 90);
    this.vy = -260; this.onGround = false;
  }

  update(time, deltaMs) {
    const dt = Math.min(deltaMs / 1000, 0.05);
    const { GROUND } = CFG;
    if (!this.ready || this.done) return;
    this.t += dt;
    const left = CFG.ROUND_SEC - this.t;
    this.timerText.setText(`남은 시간 ${Math.max(0, Math.ceil(left))}초`);
    this.hitText.setText(`위험 공격에 맞은 횟수: ${this.stats.hitsDanger}`);
    if (left <= 0) return this.finish();

    // 보스 패턴 실행
    while (this.next < this.schedule.length && this.schedule[this.next].t <= this.t) this.spawn(this.schedule[this.next++]);

    // 아군
    for (const a of this.allies) {
      a.sprite.x += a.dir * 60 * dt;
      if (Math.abs(a.sprite.x - a.base) > 50) a.dir *= -1;
      a.cd -= dt;
      if (a.cd <= 0) { this.allyCast(a); a.cd = 0.35 + Math.random() * 0.45; }
    }

    // 나: 이동
    const k = this.keys;
    this.dashCd -= dt; this.atkCd -= dt; this.invuln -= dt;
    if (this.dashT > 0) {
      this.dashT -= dt; this.me.x += this.face * 620 * dt;
    } else {
      let mv = 0; if (k.LEFT.isDown) mv -= 1; if (k.RIGHT.isDown) mv += 1;
      if (mv) this.face = mv;
      this.me.x += mv * 270 * dt;
      if ((Phaser.Input.Keyboard.JustDown(k.UP) || Phaser.Input.Keyboard.JustDown(k.SPACE)) && this.onGround) { this.vy = -560; this.onGround = false; }
      if (Phaser.Input.Keyboard.JustDown(k.X) && this.dashCd <= 0) { this.dashT = 0.22; this.dashCd = 0.8; this.stats.dashes++; }
      if (Phaser.Input.Keyboard.JustDown(k.Z) && this.atkCd <= 0) {
        this.atkCd = 0.3; this.stats.attacks++;
        const sl = this.add.circle(this.me.x + this.face * 36, this.me.y, 26, 0xffe9a8, 0.7).setDepth(this.D.me);
        this.tweens.add({ targets: sl, alpha: 0, scale: 1.4, duration: 160, onComplete: () => sl.destroy() });
      }
    }
    this.vy += 1500 * dt; this.me.y += this.vy * dt;
    if (this.me.y >= GROUND - 35) { this.me.y = GROUND - 35; this.vy = 0; this.onGround = true; }
    this.me.x = Phaser.Math.Clamp(this.me.x, 30, 700);
    this.me.flipX = this.face < 0;
    this.me.setAlpha(this.invuln > 0 ? (Math.floor(this.t * 20) % 2 ? 0.3 : 1) : 1);
    if (this.B) {
      this.marker.setPosition(this.me.x, GROUND + 4);
      this.markerArrow.setPosition(this.me.x, this.me.y - 58);
      this.outline.setPosition(this.me.x, this.me.y); this.outline.flipX = this.me.flipX;
    }
    if (this.shield > 0) { this.shield -= dt; this.shieldFx.setPosition(this.me.x, this.me.y); if (this.shield <= 0) this.shieldFx.setVisible(false); }

    // 위험 판정
    for (const h of this.hazards) {
      if (h.active === 0) {
        h.t -= dt;
        if (h.t <= 0) { // 발동
          h.active = h.type === 'slam' ? 0.25 : 0.45;
          if (h.bang) h.bang.destroy();
          this.tweens.killTweensOf(h.g);
          h.g.setAlpha(1);
          if (h.type === 'slam') { h.g.setFillStyle(this.B ? CFG.DANGER : 0xffffff, 0.85); this.cameras.main.shake(120, 0.004); }
          else { h.g.setFillStyle(this.B ? CFG.DANGER : 0xffffff, 0.9); h.g.height = 34; }
        }
      } else {
        h.active -= dt;
        if (!h.hitDone) {
          let hit = false;
          if (h.type === 'slam') hit = Math.abs(this.me.x - h.x) < h.r && this.me.y > GROUND - 70;
          else hit = this.me.y > GROUND - 60;
          if (hit && this.invuln <= 0 && this.dashT <= 0) { h.hitDone = true; this.takeHit(h.type); }
        }
        if (h.active <= 0) { h.dead = true; this.tweens.add({ targets: h.g, alpha: 0, duration: 150, onComplete: () => h.g.destroy() }); }
      }
    }
    this.hazards = this.hazards.filter(h => !h.dead);
  }

  finish() {
    this.done = true;
    const r = { round: this.index + 1, mode: this.mode, patterns: this.next, ...this.stats };
    LOG.rounds.push(r);
    this.scene.start('Survey', { index: this.index, result: r });
  }
}

// =====================================================================
class SurveyScene extends Phaser.Scene {
  constructor() { super('Survey'); }
  init(d) { this.index = d.index; this.result = d.result; }
  create() {
    const { W, H } = CFG;
    this.add.rectangle(W / 2, H / 2, W, H, 0x2a2350);
    this.add.text(W / 2, 50, `라운드 ${this.index + 1} 끝!  위험 공격에 맞은 횟수: ${this.result.hitsDanger}`, { fontFamily: 'sans-serif', fontSize: 24, color: '#ffe14f' }).setOrigin(0.5);
    this.qs = [
      { q: 'Q1. 싸우는 동안 내 캐릭터가 어디 있는지 놓친 순간이 있었나요?', opts: ['1  없었다', '2  1~2번 있었다', '3  여러 번 있었다'], key: 'lostSelf' },
      { q: 'Q2. 피해야 하는 공격과 그냥 연출을 구분하기 쉬웠나요?', opts: ['1  매우 어려웠다', '2  어려웠다', '3  보통', '4  쉬웠다', '5  매우 쉬웠다'], key: 'clarity' },
    ];
    this.answers = {}; this.step = 0;
    this.qText = this.add.text(W / 2, 170, '', { fontFamily: 'sans-serif', fontSize: 22, color: '#ffffff', align: 'center', wordWrap: { width: 860 } }).setOrigin(0.5);
    this.optTexts = [];
    this.show();
    this.input.keyboard.on('keydown', (e) => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= this.qs[this.step].opts.length) this.answer(n);
    });
  }
  show() {
    this.optTexts.forEach(t => t.destroy()); this.optTexts = [];
    const q = this.qs[this.step];
    this.qText.setText(q.q + '\n(숫자 키 또는 클릭)');
    q.opts.forEach((o, i) => {
      const t = this.add.text(CFG.W / 2, 250 + i * 46, o, { fontFamily: 'sans-serif', fontSize: 22, color: '#c9c2ff', backgroundColor: '#1d1640', padding: { x: 16, y: 6 } })
        .setOrigin(0.5).setInteractive({ useHandCursor: true });
      t.on('pointerdown', () => this.answer(i + 1));
      this.optTexts.push(t);
    });
  }
  answer(n) {
    this.answers[this.qs[this.step].key] = n;
    this.step++;
    if (this.step < this.qs.length) return this.show();
    Object.assign(this.result, this.answers);
    LOG.send('pp_round_end', this.result);
    if (this.index === 0) this.scene.start('Round', { index: 1 });
    else this.scene.start('Final');
  }
}

// =====================================================================
class FinalScene extends Phaser.Scene {
  constructor() { super('Final'); }
  create() {
    const { W, H } = CFG;
    this.add.rectangle(W / 2, H / 2, W, H, 0x2a2350);
    const [r1, r2] = LOG.rounds;
    this.add.text(W / 2, 60, '마지막 질문', { fontFamily: 'sans-serif', fontSize: 30, color: '#7ef0ff' }).setOrigin(0.5);
    this.add.text(W / 2, 120, `라운드 1: ${r1.hitsDanger}번 맞음    라운드 2: ${r2.hitsDanger}번 맞음`, { fontFamily: 'sans-serif', fontSize: 22, color: '#ffffff' }).setOrigin(0.5);
    this.add.text(W / 2, 190, 'Q3. 어느 라운드가 더 플레이하기 편했나요?', { fontFamily: 'sans-serif', fontSize: 22, color: '#ffffff' }).setOrigin(0.5);
    const opts = ['1  라운드 1', '2  라운드 2', '3  비슷했다'];
    const pick = (n) => {
      if (this.picked) return; this.picked = true;
      const prefer = n === 3 ? 'same' : LOG.order[n - 1];
      LOG.send('pp_session_end', { order: LOG.order, prefer, r1, r2 });
      this.add.text(W / 2, 460, '참여해 주셔서 감사합니다! 창을 닫으셔도 됩니다. 🙇', { fontFamily: 'sans-serif', fontSize: 22, color: '#ffe14f' }).setOrigin(0.5);
    };
    opts.forEach((o, i) => {
      const t = this.add.text(W / 2, 260 + i * 50, o, { fontFamily: 'sans-serif', fontSize: 22, color: '#c9c2ff', backgroundColor: '#1d1640', padding: { x: 16, y: 6 } })
        .setOrigin(0.5).setInteractive({ useHandCursor: true });
      t.on('pointerdown', () => pick(i + 1));
    });
    this.input.keyboard.on('keydown', (e) => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 3) pick(n); });
  }
}

new Phaser.Game({
  type: Phaser.AUTO, parent: 'game', width: CFG.W, height: CFG.H, backgroundColor: '#0a0618',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [TitleScene, RoundScene, SurveyScene, FinalScene],
});
</script>
